name: Build and Deploy YorubaDay Platform

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: promax-event-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The platform is a Node server (committee login, RSVP, SQL Server).
      # A static export cannot open the database. This job builds the Next.js
      # standalone server and uploads that folder over FTP.
      # SQL Server is reached only by the app after it is running on the
      # Windows server. This job does not open a database connection.
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=0
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER secret"; missing=1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME secret"; missing=1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD secret"; missing=1; }
          test -n "$MSSQL_PASSWORD" || { echo "Missing MSSQL_PASSWORD secret"; missing=1; }
          test "${#SESSION_SECRET}" -ge 32 || { echo "SESSION_SECRET must be at least 32 characters"; missing=1; }
          test "${#ADMIN_PASSWORD}" -ge 12 || { echo "ADMIN_PASSWORD must be at least 12 characters"; missing=1; }
          test -n "$SMTP_PASSWORD" || { echo "Missing SMTP_PASSWORD secret"; missing=1; }
          test "$missing" -eq 0

      - name: Assemble Windows server package
        env:
          MSSQL_SERVER: '127.0.0.1\SQLEXPRESS'
          MSSQL_DATABASE: YorubaDayCanberra
          MSSQL_USER: yorubaday_admin
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAIL: admin@promaxevent.com
          ADMIN_FULL_NAME: Platform Administrator
          MAIL_FROM: Promax Event <support@promaxcare.com.au>
          SMTP_HOST: mail.promaxcare.com.au
          SMTP_PORT: "587"
          SMTP_USER: support@promaxcare.com.au
          DEPLOY_ID: ${{ github.run_id }}-${{ github.sha }}
        run: |
          rm -rf deploy deploy-recycle
          mkdir -p deploy/.next deploy/sql/mssql deploy/logs
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          cp sql/mssql/*.sql deploy/sql/mssql/
          cp hosting/iis/preload.cjs hosting/iis/start-node.cmd hosting/iis/web.config hosting/iis/grant-iis-access.ps1 deploy/
          node scripts/write-deploy-env.mjs deploy/.env
          # The standalone trace includes node_modules. The Windows site already
          # has that folder from the first upload, so it is not sent again and
          # the sync is not allowed to delete it.
          rm -rf deploy/node_modules
          node scripts/prepare-windows-deploy.mjs deploy deploy-recycle "$DEPLOY_ID"
          echo "Build verification successful."
          find deploy deploy-recycle -maxdepth 2 -type f ! -name '.env' | head -50

      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The Windows FTP service refuses TLS: 534 Local policy does not
          # allow TLS secure connections. Plain FTP is what that server accepts.
          protocol: ftp
          local-dir: deploy/
          server-dir: /yorubadayapp/
          dangerous-clean-slate: false
          # node_modules stays as it is on the server. web.config is uploaded
          # by the next step, after these files, so IIS does not restart early.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/**
            **/web.config
            **/.ftp-deploy-sync-state*.json

      - name: Restart IIS with the new files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy-recycle/
          server-dir: /yorubadayapp/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-recycle.json
          exclude: |
            **/.ftp-deploy-sync-state*.json

      - name: Deployment completed
        run: |
          echo "YorubaDay Platform deployment completed successfully."
          echo "Application files were uploaded first. web.config was uploaded last so IIS restarts Node against the new pages."
          echo "node_modules on the server was left in place."
          echo "The app applies sql/mssql/001_create_and_migrate.sql and creates the Super Admin on startup."
